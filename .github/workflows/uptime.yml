name: mulgil-uptime
on:
  schedule:
    - cron: "2-57/5 * * * *"   # 정각·5분 경계는 GitHub 예약 지연이 심해 2분 오프셋
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 점검
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 check.py
      - name: 상태 저장
        run: |
          if [ -f COMMIT ]; then
            rm -f COMMIT
            git config user.name "mulgil-uptime"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "상태 $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
            git pull --rebase origin main || true
            git push
          fi
