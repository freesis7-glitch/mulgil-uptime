name: mulgil-uptime
on:
  schedule:
    - cron: "2-57/5 * * * *"   # 예약은 보조(GitHub 예약기가 새 저장소를 안 태우는 일이 있어 아래 자기 재실행 연쇄가 주 경로)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: 5분 간격 점검 루프 (약 5.5시간)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "mulgil-uptime"
          git config user.email "actions@users.noreply.github.com"
          for i in $(seq 1 66); do
            python3 check.py || true
            if [ -f COMMIT ]; then
              rm -f COMMIT
              git add state.json
              git commit -m "상태 $(date -u +%Y-%m-%dT%H:%MZ)" >/dev/null 2>&1 || true
              git pull --rebase origin main >/dev/null 2>&1 || true
              git push >/dev/null 2>&1 || true
            fi
            if [ "$i" -lt 66 ]; then sleep 300; fi
          done
          echo "루프 종료"
      - name: 다음 실행 연쇄
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mulgil-uptime -R "$GITHUB_REPOSITORY" || true
